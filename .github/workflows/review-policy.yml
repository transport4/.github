name: Review policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy/review-classification
    runs-on: ubuntu-latest

    steps:
      - name: Validate review policy
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const errors = [];

            // Parse level-two Markdown sections.
            const headingMatches = [
              ...body.matchAll(/^##\s+(.+?)\s*$/gm)
            ];

            const sections = new Map();

            for (let index = 0; index < headingMatches.length; index++) {
              const heading = headingMatches[index];
              const nextHeading = headingMatches[index + 1];

              const start = heading.index + heading[0].length;
              const end = nextHeading ? nextHeading.index : body.length;

              const content = body
                .slice(start, end)
                .replace(/<!--[\s\S]*?-->/g, "")
                .trim();

              sections.set(heading[1].trim().toLowerCase(), content);
            }

            const requiredSections = [
              "intent",
              "approach",
              "key decisions",
              "failure modes",
              "validation",
              "adversarial review",
              "operational safety"
            ];

            for (const section of requiredSections) {
              if (!sections.get(section)) {
                errors.push(`Section "${section}" must be completed.`);
              }
            }

            const escapeRegex = value =>
              value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

            const isChecked = label => {
              const pattern = new RegExp(
                `^-\\s*\\[[xX]\\]\\s*${escapeRegex(label)}\\s*$`,
                "m"
              );

              return pattern.test(body);
            };

            const classifications = [
              "Experiment or prototype",
              "Standard change eligible for self-merge",
              "Independent human review required"
            ];

            const selectedClassifications =
              classifications.filter(isChecked);

            if (selectedClassifications.length !== 1) {
              errors.push(
                "Select exactly one review classification."
              );
            }

            const attestations = [
              "Automated checks pass or have a documented exception.",
              "I performed an adversarial review.",
              "I can explain and defend this change at a whiteboard.",
              "I identified whether this change requires independent human review."
            ];

            for (const attestation of attestations) {
              if (!isChecked(attestation)) {
                errors.push(`Required attestation is missing: ${attestation}`);
              }
            }

            const humanReviewRequired = isChecked(
              "Independent human review required"
            );

            if (humanReviewRequired) {
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100
                }
              );

              // Keep only each reviewer's most recent review.
              const latestReviews = new Map();

              for (const review of reviews) {
                if (!review.user || review.user.type === "Bot") {
                  continue;
                }

                const existing = latestReviews.get(review.user.login);

                if (!existing || review.id > existing.id) {
                  latestReviews.set(review.user.login, review);
                }
              }

              const approvedReviewers = [];

              for (const [login, review] of latestReviews) {
                if (login === pr.user.login) {
                  continue;
                }

                // An approval must apply to the current PR head.
                if (
                  review.state !== "APPROVED" ||
                  review.commit_id !== pr.head.sha
                ) {
                  continue;
                }

                const permissionResponse =
                  await github.rest.repos.getCollaboratorPermissionLevel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: login
                  });

                const permission = permissionResponse.data.permission;

                if (["admin", "maintain", "write"].includes(permission)) {
                  approvedReviewers.push(login);
                }
              }

              if (approvedReviewers.length === 0) {
                errors.push(
                  "Independent human review requires approval from a collaborator with write access on the current commit."
                );
              } else {
                core.info(
                  `Current approval supplied by: ${approvedReviewers.join(", ")}`
                );
              }
            }

            if (errors.length > 0) {
              core.setFailed(
                `Review policy failed:\n\n- ${errors.join("\n- ")}`
              );
            } else {
              core.info("Review policy passed.");
            }