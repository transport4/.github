# Calls the organization-owned policy so its required status check is reported here.
name: Review policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    uses: transport4/.github/.github/workflows/review-policy.yml@main
